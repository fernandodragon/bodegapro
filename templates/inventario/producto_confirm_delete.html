{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm"><div class="card-body p-4 text-center">
    <div class="display-5 text-danger mb-2"><i class="bi bi-exclamation-triangle"></i></div>
    <h1 class="h4 fw-bold">Eliminar producto</h1>
    <p class="text-muted">¿Seguro que deseas eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger px-4" type="submit">Sí, eliminar</button>
      <a class="btn btn-outline-secondary" href="{% url 'producto_list' %}">Cancelar</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
