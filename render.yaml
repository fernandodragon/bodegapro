# Blueprint de Render: crea la web y la base de datos PostgreSQL
databases:
  - name: techlogix-db
    plan: free   # el plan gratuito de Postgres expira; para produccion usar basic-256mb
    databaseName: techlogix
    user: techlogix

services:
  - type: web
    name: techlogix
    runtime: python
    plan: free   # para evitar que "duerma": starter
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: techlogix-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@bodegapro.cl
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
